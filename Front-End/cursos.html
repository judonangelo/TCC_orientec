<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - Orientec</title>
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/cursos.css">
</head>

<body>
    <header class="default-header">
        <div class="header-inner">
            <a href="home.html" class="logo">Orientec</a>
            <nav class="nav-menu">
                <a href="home.html">Início</a>
                <a href="cursos.html" class="active">Cursos</a>
                <a href="home.html#servicos">Serviços</a>
                <a href="home.html#contato">Contato</a>
            </nav>
            <button class="btn-perfil" onclick="openPanel()">Usuário</button>
        </div>
    </header>

    <main class="container">
        <section class="cursos-section">
            <h2>Conheça Nossos Cursos Técnicos</h2>
            <div class="cursos-grid" id="cursos-grid"></div>
        </section>
    </main>

    <footer class="default-footer">
        <p>© 2026 Orientec - Todos os direitos reservados</p>
    </footer>

    <!-- Overlay e Painel Lateral -->
    <div class="panel-overlay" id="overlay" onclick="closePanel()"></div>

    <aside class="profile-panel" id="profilePanel">
        <div class="panel-header">
            <button class="panel-close" onclick="closePanel()">✕</button>
            <div class="panel-avatar" id="panelInitials">??</div>
            <div class="panel-user-name" id="panelName">Estudante X</div>
            <div class="panel-user-email" id="panelEmail">estudante@email.com</div>
        </div>
        <div class="panel-body">
            <div id="sectionInfo">
                <p class="panel-section-title">Informações da Conta</p>
                <div id="viewMode">
                    <div class="info-field">
                        <label>Nome completo</label>
                        <span id="viewName">Estudante da Silva</span>
                    </div>
                    <div class="info-field">
                        <label>E-mail</label>
                        <span id="viewEmail">estudante@email.com</span>
                    </div>
                </div>
            </div>
            <hr style="margin: 24px 0; border-color: #e2e8f0;">
            <button class="btn-save" onclick="window.location.href='alterar_senha.html'" style="margin-top:12px;">Trocar
                senha</button>
            <button class="btn-danger-outline" onclick="logout()">Sair da conta</button>
        </div>
    </aside>

    <script src="script/cursos.js"></script>
    <script src="script/perfil.js"></script>
</body>

</html>
