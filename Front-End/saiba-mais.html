<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saiba Mais - Orientec</title>
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/saiba-mais.css">
</head>

<body>

    <header class="default-header">
        <div class="header-inner">
            <a href="home.html" class="logo">Orientec</a>
            <nav class="nav-menu">
                <a href="home.html">Início</a>
                <a href="cursos.html">Cursos</a>
                <a href="home.html#servicos">Serviços</a>
                <a href="home.html#contato">Contato</a>
            </nav>
            <button class="btn-perfil" onclick="window.location.href='home.html'">Usuário</button>
        </div>
    </header>

    <main class="saiba-container">
        <button class="btn-voltar" onclick="history.back()">← Voltar para Cursos</button>
        <div id="conteudo-curso" class="curso-detalhe-card">
        </div>
    </main>

    <footer class="default-footer">
        <p>© 2026 Orientec - Todos os direitos reservados</p>
    </footer>

    <script>
        const API_URL = "http://localhost:3000";

        async function carregarCursoPorId(id) {
            const container = document.getElementById('conteudo-curso');

            try {
                const response = await fetch(`${API_URL}/cursos/${id}`);

                if (response.status === 404) {
                    container.innerHTML = `
                        <div class="erro-card">
                            <h2>Curso não encontrado</h2>
                            <p>O curso que você procura não existe ou foi removido.</p>
                            <button class="btn-voltar" onclick="history.back()">← Voltar para Cursos</button>
                        </div>
                    `;
                    return;
                }

                if (!response.ok) {
                    throw new Error(`Erro ao buscar curso: ${response.status}`);
                }

                const curso = await response.json();

                container.innerHTML = `
                    <h1>${curso.nome}</h1>
                    <div class="info-grid">
                        <div class="info-item"><strong>Duração:</strong> ${curso.duracao} semestres</div>
                        <div class="info-item"><strong>Faixa salarial:</strong> ${curso.salario}</div>
                        <div class="info-item"><strong>Carga Horária:</strong> ${curso.carga_horaria}</div>
                    </div>
                    <div class="secao destaque">
                        <h3>Descrição</h3>
                        <p>${curso.descricao}</p>
                    </div>
                    <div class="secao">
                        <h3>Mercado de Trabalho</h3>
                        <p>${curso.mercado}</p>
                    </div>
                    <div class="secao">
                        <h3>Perfil do Aluno</h3>
                        <p>${curso.perfil}</p>
                    </div>
                `;

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="erro-card">
                        <h2>Erro ao carregar curso</h2>
                        <p>Não foi possível buscar os dados. Tente novamente mais tarde.</p>
                        <button class="btn-voltar" onclick="history.back()">← Voltar para Cursos</button>
                    </div>
                `;
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const container = document.getElementById('conteudo-curso');

        if (!id) {
            container.innerHTML = `
                <div class="erro-card">
                    <h2>Curso não encontrado</h2>
                    <p>Nenhum curso foi selecionado.</p>
                    <button class="btn-voltar" onclick="history.back()">← Voltar para Cursos</button>
                </div>
            `;
        } else {
            carregarCursoPorId(id);
        }
    </script>
</body>

</html>
