<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Orientec</title>
    <link rel="stylesheet" href="/Front-End/CSS/global.css">
    <link rel="stylesheet" href="/Front-End/CSS/login.css">
</head>
<body class="page-login">
    <div class="login-container">
        <div class="logo">
            <h1>Orientec</h1>
            <p>Orientação de Carreira com Teste Vocacional</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label>Insira seu CPF</label>
                <input type="text" id="cpf" placeholder="Digite seu CPF" required>
            </div>

            <div class="form-group">
                <label>Insira seu E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="form-group">
                <label>Insira sua senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-entrar">Cadastrar</button>
            <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">Voltar para Home</button>
            
            <p class="login-link-container">
                Já tem uma conta? <a href="login.html">Login</a>
            </p>
        </form>
        <div id="mensagem" class="mensagem"></div>
    </div>

    <script src="/Front-End/script/cadastro.js"></script>
</body>
</html>
