<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orientec</title>
    <link rel="stylesheet" href="/Front-End/CSS/global.css">
    <link rel="stylesheet" href="/Front-End/CSS/login.css">
    <link rel="icon" href="/Front-End/assets/Orientec-Borda.png" type="image/png">
</head>

<body class="page-login">

    <div class="login-container">
        <div class="logo">
            <h1>Orientec</h1>
            <p>Orientação de Carreira com Teste Vocacional</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="esqueci-senha">
                <a href="alterar_senha.html">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
            <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">Voltar para Home</button>
            
                <p class="login-link-container">
                    Ainda não tem uma conta? <a href="cadastro.html" >Cadastre-se</a>
                </p>
           
        </form>
        <div id="mensagem" class="mensagem"></div>
    </div>


    <script src="/Front-End/script/login.js"></script>
</body>

</html>
