<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha - Orientec</title>
    <link rel="stylesheet" href="/Front-End/CSS/global.css">
    <link rel="stylesheet" href="/Front-End/CSS/login.css">
    <link rel="icon" href="/Front-End/assets/Orientec-Borda.png" type="image/png">
</head>

<body class="page-login">

    <div class="login-container">
        <div class="logo">
            <h1>Orientec</h1>
            <p>Orientação de Carreira com Teste Vocacional</p>
        </div>

        <h2 style="text-align:center; color:#0c3470; margin-bottom:20px;">Redefinir Senha</h2>

        <form id="formTrocarSenha">
            <div class="form-group" id="groupSenhaAtual">
                <label>Senha Atual</label>
                <input type="password" id="senhaAtual" placeholder="Digite sua senha atual">
            </div>

            <div class="form-group" id="groupEmail" style="display: none;">
                <label>E-mail cadastrado</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">
            </div>

            <div class="form-group" id="groupCPF" style="display: none;">
                <label>CPF cadastrado</label>
                <input type="text" id="cpf" placeholder="Apenas os 11 números" maxlength="14">
            </div>

            <div class="form-group">
                <label>Nova senha</label>
                <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="form-group">
                <label>Confirmar nova senha</label>
                <input type="password" id="confirmarSenha" placeholder="Repita a nova senha" required>
            </div>

            <button type="submit" class="btn-entrar" id="btnSubmit">Salvar Alteração</button>
            <button type="button" class="btn-voltar" onclick="voltarPagina()">Voltar</button>
        </form>

    </div>


    <script>
        var nivelNecessario = "any"
    </script>
    <script src="/Front-End/script/alterar_senha.js"></script>
</body>

</html>
