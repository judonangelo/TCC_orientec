<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orientec</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-login">

    <div class="login-container">
        <div class="logo">
            <h1>Orientec</h1>
            <p>Orientação de Carreira com Teste Vocacional</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="esqueci-senha">
                <a href="#" onclick="abrirModalRecuperarSenha()">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
            <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">Voltar para
                Home</button>
            <a href="cadastro.html">Não possui cadastro?</a>
        </form>
        <div id="mensagem" class="mensagem"></div>
    </div>

    <div id="modalRecuperar" class="modal">
        <div class="modal-content">
            <h3>Recuperar Senha</h3>
            <p>Digite seu e-mail cadastrado para receber as instruções de recuperação de senha.</p>
            <input type="email" id="emailRecuperacao" placeholder="Seu e-mail">
            <div class="modal-buttons">
                <button class="btn-enviar" onclick="enviarRecuperacao()">Enviar</button>
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // Login
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const mensagemDiv = document.getElementById("mensagem");

            try {
                const resposta = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, senha }) // ← envia "email" igual ao back-end espera
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    mensagemDiv.className = "mensagem sucesso";
                    mensagemDiv.textContent = "Login realizado com sucesso!";

                    // 1. Salva o token no navegador do usuário
                    localStorage.setItem("tokenOrientec", dados.token);

                    // 2. Aguarda 1 segundo (para o usuário ler a mensagem) e muda de página
                    setTimeout(() => {
                        window.location.href = "home.html"; // Coloque aqui o nome exato do arquivo da sua página principal
                    }, 1000);

                } else {
                    mensagemDiv.className = "mensagem erro";
                    mensagemDiv.textContent = dados.mensagem || "Usuário ou senha incorretos.";
                }

            } catch (erro) {
                mensagemDiv.className = "mensagem erro";
                mensagemDiv.textContent = "Erro de conexão com o servidor.";
                console.error(erro);
            }
        });

        // Modal recuperar senha
        function abrirModalRecuperarSenha() {
            document.getElementById('modalRecuperar').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalRecuperar').style.display = 'none';
            document.getElementById('emailRecuperacao').value = '';
        }

        function enviarRecuperacao() {
            const email = document.getElementById('emailRecuperacao').value;
            const mensagemDiv = document.getElementById('mensagem');

            if (email === '') {
                alert('Por favor, digite seu e-mail.');
                return;
            }

            fecharModal();

            mensagemDiv.className = 'mensagem info';
            mensagemDiv.innerHTML = 'Instruções de recuperação enviadas para ' + email + '. Verifique sua caixa de entrada.';

            setTimeout(() => {
                mensagemDiv.className = 'mensagem';
                mensagemDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>

</html>
