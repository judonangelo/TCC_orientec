<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orientec</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            padding: 50px;
            width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-container h2 {
            color: #0c3470;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitulo {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0c3470;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0c3470;
            box-shadow: 0 0 5px rgba(12, 52, 112, 0.3);
        }

        .esqueci-senha {
            text-align: right;
            margin-bottom: 20px;
        }

        .esqueci-senha a {
            color: #0c3470;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .esqueci-senha a:hover {
            text-decoration: underline;
            color: #1a4a8a;
        }

        .btn-entrar {
            width: 100%;
            background-color: #0c3470;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-entrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-voltar {
            width: 100%;
            background-color: transparent;
            color: #0c3470;
            border: 2px solid #0c3470;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-voltar:hover {
            background-color: #0c3470;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .mensagem {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .mensagem.erro {
            background-color: #ffe6e6;
            color: #d32f2f;
            border: 1px solid #ffcccc;
            display: block;
        }

        .mensagem.sucesso {
            background-color: #e6f4ea;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: block;
        }

        .mensagem.info {
            background-color: #e3f2fd;
            color: #0c3470;
            border: 1px solid #bbdef5;
            display: block;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: #0c3470;
            font-size: 32px;
        }

        .logo p {
            color: #666;
            font-size: 12px;
        }

      
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            color: #0c3470;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-enviar {
            flex: 1;
            background-color: #0c3470;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancelar {
            flex: 1;
            background-color: #ccc;
            color: #333;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Orientec</h1>
            <p>Orientação de Carreira com Teste Vocacional</p>
        </div>

        
        <form id="loginForm">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="esqueci-senha">
                <a href="#" onclick="abrirModalRecuperarSenha()">Esqueci minha senha?</a>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
            <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">Voltar para Home</button>
        </form>
        <div id="mensagem" class="mensagem"></div>
    </div>

   
    <div id="modalRecuperar" class="modal">
        <div class="modal-content">
            <h3>Recuperar Senha</h3>
            <p>Digite seu e-mail cadastrado para receber as instruções de recuperação de senha.</p>
            <input type="email" id="emailRecuperacao" placeholder="Seu e-mail">
            <div class="modal-buttons">
                <button class="btn-enviar" onclick="enviarRecuperacao()">Enviar</button>
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const mensagemDiv = document.getElementById('mensagem');
       
            if (usuario === 'admin' && senha === '123456') {
                mensagemDiv.className = 'mensagem sucesso';
                mensagemDiv.innerHTML = 'Login realizado com sucesso! Redirecionando...';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } else {
                mensagemDiv.className = 'mensagem erro';
                mensagemDiv.innerHTML = 'Usuário ou senha incorretos! Tente novamente.';
                
                setTimeout(() => {
                    mensagemDiv.className = 'mensagem';
                    mensagemDiv.innerHTML = '';
                }, 3000);
            }
        });

        function abrirModalRecuperarSenha() {
            document.getElementById('modalRecuperar').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalRecuperar').style.display = 'none';
            document.getElementById('emailRecuperacao').value = '';
        }

        function enviarRecuperacao() {
            const email = document.getElementById('emailRecuperacao').value;
            const mensagemDiv = document.getElementById('mensagem');
            
            if (email === '') {
                alert('Por favor, digite seu e-mail.');
                return;
            }
            

            fecharModal();
            

            mensagemDiv.className = 'mensagem info';
            mensagemDiv.innerHTML = 'Instruções de recuperação enviadas para ' + email + '. Verifique sua caixa de entrada.';
            
           
            setTimeout(() => {
                mensagemDiv.className = 'mensagem';
                mensagemDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
