<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orientec</title>
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body class="page-login">

    <div class="login-container">
        <div class="logo">
            <h1>Orientec</h1>
            <p>Orientação de Carreira com Teste Vocacional</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="esqueci-senha">
                <a href="alterar_senha.html">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
            <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">Voltar para
                Home</button>
            <a href="cadastro.html">Não possui cadastro?</a>
        </form>
        <div id="mensagem" class="mensagem"></div>
    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const mensagemDiv = document.getElementById("mensagem");

            try {
                const resposta = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, senha }) 
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    mensagemDiv.className = "mensagem sucesso";
                    mensagemDiv.textContent = "Login realizado com sucesso!";

                   
                    localStorage.setItem('tokenOrientec', dados.token);
                    localStorage.setItem('emailUsuario', email);   

                   
                    setTimeout(() => {
                        window.location.href = "home.html"; 
                    }, 1000);

                } else {
                    mensagemDiv.className = "mensagem erro";
                    mensagemDiv.textContent = dados.mensagem || "Usuário ou senha incorretos.";
                }

            } catch (erro) {
                mensagemDiv.className = "mensagem erro";
                mensagemDiv.textContent = "Erro de conexão com o servidor.";
                console.error(erro);
            }
        });

    </script>
</body>

</html>
